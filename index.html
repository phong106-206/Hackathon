<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"/>        
    <script src="script.js"></script>
</head>
<body>
    <div class="quiz-container">
        <h1 tabindex="0">Group 1 Hackathon </h1>
        <div class ="svg-graphic">
            <svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <rect width="400" height="400" fill="#02111B" rx="24"/>
            <circle cx="320" cy="80" r="60" fill="#30292F" opacity="0.7"/>
            <circle cx="80" cy="320" r="80" fill="#3F4045" opacity="0.5"/>
            <rect x="45" y="45" width="310" height="310" rx="16" fill="none" stroke="#5d737E" stroke-width="3" opacity="0.6"/>
            <rect x="75" y="125" width="250" height="150" rx="16" fill="#3F4045" stroke="#5d737E" stroke-width="3"/>
            <text x="200" y="221" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="#FCFCFC" text-anchor="middle" letter-spacing="3">QUIZ!</text>
            </svg>
        </div>
        <p>Test your knowledge with a list of ...</p>

        <div id="start-screen" class="hidden">
            <button id="start-btn">Start Quiz</button>.
        </div>
        
        <div id="quiz-screen" class="hidden">
            <h2 id="question"><!-- Question should be displayed here --></h2>
            <div id="answers"><!-- Answers should be displayed here--></div>
            <p id="feedback"></p>
            <button id="next-btn" class="hidden">Next Question</button>
        </div>

        <div id="result-screen" class="hidden">
            <h2>Quiz Completed</h2>
            <p id="final-score"></p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <footer>
        <div class ="footer-container">
            <p id="footer-text"> &copy; Phong Nguyen Lily Despins Jeremy Fuentes Rivera Ramirez Christopher Kuharski</p>
            
        </div>
    </footer>
</body>
</html>
